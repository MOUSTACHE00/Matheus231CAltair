<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortal Kombat - Choose Your Destiny</title>
    <style>
        /* Reset básico e fontes */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Permanent+Marker&family=Roboto:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            background-image: radial-gradient(circle, #1a0505 0%, #050505 100%);
            overflow-x: hidden;
        }

        /* Cabeçalho */
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 3px solid #8b0000;
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.5);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #8b0000, 6px 6px 15px #000;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        header p {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.5rem;
            color: #ff3333;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Seção de Seleção de Personagens */
        .character-selection {
            text-align: center;
            margin-bottom: 50px;
        }

        .character-selection h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .grid-characters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        /* Card de Personagem */
        .char-card {
            background: #151515;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        .char-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #ff3333;
            box-shadow: 0 10px 25px rgba(255, 51, 51, 0.4);
        }

        /* Placeholder para a imagem do lutador */
        .char-img {
            height: 300px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            position: relative;
        }

        .scorpion .char-img { background-color: #e67e22; }
        .subzero .char-img { background-color: #2980b9; }
        .liukang .char-img { background-color: #c0392b; }
        .raiden .char-img { background-color: #7f8c8d; }
