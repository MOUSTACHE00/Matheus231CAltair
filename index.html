<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortal Kombat - Enhanced Canvas Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a0505 0%, #0a0202 100%);
            color: white;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 42px;
            color: #ff2a00;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7), 4px 4px 0px #000;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #game-container {
            position: relative;
            border: 5px solid #222;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 42, 0, 0.3);
            background-color: #000;
        }

        /* Interface do Usuário (HUD) */
        #hud {
            position: absolute;
            top: 25px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            user-select: none;
        }

        .health-container {
            width: 42%;
            height: 24px;
            background: rgba(40, 40, 40, 0.8);
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to bottom, #ffe600 0%, #ff3300 100%);
            transition: width 0.15s ease-out;
        }

        #p1-health-bar {
            transform-origin: left;
        }

        #p2-health-bar {
            transform-origin: right;
            background: linear-gradient(to bottom, #ffe600 0%, #ff3300 100%);
        }

        .player-name {
            position: absolute;
            top: -20px;
            font-size: 16px;
            color: #fff;
            text-shadow: 2px 2px 2px #000;
            letter-spacing: 1px;
        }

        #p2-name { right: 0; }

        #timer {
            font-size: 36px;
            color: #fff;
            background: radial-gradient(circle, #333 0%, #111 100%);
            padding: 5px 18px;
            border: 3px solid #ffd700;
            border-radius: 3px;
            text-shadow: 2px 2px 4px #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            min-width: 40px;
            text-align: center;
        }

        /* Tela de Fim de Jogo */
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
        }

        #win-text {
            font-size: 60px;
            color: #ff2a00;
            text-shadow: 0 0 20px rgba(255,42,0,0.8), 3px 3px 0 #000;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            font-family: 'Impact', sans-serif;
            background: linear-gradient(to bottom, #ff5500 0%, #990000 100%);
            color: white;
            border: 2px solid #fff;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        button:hover {
            background: linear-gradient(to bottom, #ff7733 0%, #cc0000 100%);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
        }
