<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mortal Kombat Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            color: #ff3333;
            text-shadow: 2px 2px 5px black;
            letter-spacing: 2px;
        }

        /* Container do Jogo e Interface */
        #game-container {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        /* Barras de Vida */
        .health-bar-container {
            width: 40%;
            height: 30px;
            background-color: #555;
            border: 2px solid #fff;
            position: relative;
        }

        .health-bar {
            height: 100%;
            background-color: #ffcc00;
            width: 100%;
            transition: width 0.1s ease;
        }

        #p2-health {
            float: right;
        }

        #timer {
            font-size: 30px;
            font-weight: bold;
            background-color: black;
            padding: 5px 15px;
            border: 2px solid white;
            border-radius: 5px;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }

        #game-over-text {
            font-size: 50px;
            color: #ff3333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
            background-color: #ff3333;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff6666;
        }

        .controls-hint {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>MORTAL KOMBAT</h1>

    <div id="game-container">
        <div id="ui">
            <div class="health-bar-container">
                <div id="p1-health" class="health-bar"></div>
            </div>
            <div id="timer">99</div>
            <div class="health-bar-container">
                <div id="p2-health" class="health-bar"></div>
            </div>
        </div>

        <div id="game-over-screen">
            <div id="game-over-text">PLAYER 1 WINS</div>
            <button onclick="restartGame()">RESTART</button>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="controls-hint">
        <strong>Jogador 1 (Scorpion - Amarelo):</strong> A/D para mover, W para pular, Espaço para Atacar <br>
        <strong>Jogador 2 (Sub-Zero - Azul):</strong> Ataca automaticamente se aproximar ou Clique do Mouse para soco rápido
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configurações Globais
        const gravity = 0.6;
        let timer = 99;
        let timerInterval;
        let gameOver = false;

        // Classe do Lutador
        class Fighter {
            constructor({ position, velocity, color, offset, side }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 50;
                this.height = 130;
                this.color = color;
                this.isAttacking = false;
                this.health = 100;
                this.side = side; // 'left' ou 'right'
                
                // Caixa de ataque
                this.attackBox = {
                    position: { x: this.position.x, y: this.position.y },
                    offset: offset,
                    width: 100,
                    height: 50
                };
            }

            draw() {
                // Desenha o lutador
                ctx.fillStyle = this.color;
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);

                // Desenha a cabeça do lutador (estilo ninja)
                ctx.fillStyle = '#ffdbac'; // cor de pele fictícia
                ctx.fillRect(this.position.x + (this.side === 'left' ? 15 : 10), this.position.y - 25, 25, 25);
                ctx.fillStyle = this.color; // Máscara
                ctx.fillRect(this.position.x + (this.side === 'left' ? 20 : 5), this.position.y - 15, 25, 15);

                // Desenha a caixa de ataque se estiver atacando
                if (this.isAttacking) {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(
                        this.attackBox.position.x,
                        this.attackBox.position.y,
                        this.attackBox.width,
                        this.attackBox.height
                    );
                }
            }

            update() {
                this.draw();
                
                // Atualiza a posição da caixa de ataque baseada na direção do jogador
                if (this.side === 'left') {
                    this.attackBox.position.x = this.position.x + this.attackBox.offset.x;
                } else {
                    this.attackBox.position.x = this.position.x - this.attackBox.width + this.width - this.attackBox.offset.x;
                }
                this.attackBox.position.y = this.position.y + 20;

                // Movimentação e Gravidade
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // Limite do chão da arena
                if (this.position.y + this.height + this.velocity.y >= canvas.height - 40) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - 40 - this.height;
                } else {
                    this.velocity.y += gravity;
                }

                // Limites das paredes laterais
                if (this.position.x < 0) this.position.x = 0;
                if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;
            }

            attack() {
                if (!this.isAttacking && !gameOver) {
                    this.isAttacking = true;
                    setTimeout(() => {
                        this.isAttacking = false;
                    }, 150); // Duração do golpe
                }
            }
        }

        // Inicialização dos Jogadores
        const player1 = new Fighter({
            position: { x: 150, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#e0a900', // Amarelo (Scorpion)
            offset: { x: 50, y: 0 },
            side: 'left'
        });

        const player2 = new Fighter({
            position: { x: 600, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#0055ff', // Azul (Sub-Zero)
            offset: { x: 50, y: 0 },
            side: 'right'
        });

        // Controle de teclas pressionadas
        const keys = {
            a: { pressed: false },
            d: { pressed: false },
            w: { pressed: false }
        };

        // Detecção de Colisão entre a caixa de ataque e o oponente
        function rectangularCollision({ rectangle1, rectangle2 }) {
            return (
                rectangle1.attackBox.position.x + rectangle1.attackBox.width >= rectangle2.position.x &&
                rectangle1.attackBox.position.x <= rectangle2.position.x + rectangle2.width &&
                rectangle1.attackBox.position.y + rectangle1.attackBox.height >= rectangle2.position.y &&
                rectangle1.attackBox.position.y <= rectangle2.position.y + rectangle2.height
            );
        }

        // Terminar o Jogo
        function determineWinner() {
            clearInterval(timerInterval);
            document.getElementById('game-over-screen').style.display = 'flex';
            gameOver = true;

            if (player1.health === player2.health) {
                document.getElementById('game-over-text').innerText = 'DRAW';
            } else if (player1.health > player2.health) {
                document.getElementById('game-over-text').innerText = 'SCORPION WINS';
            } else {
                document.getElementById('game-over-text').innerText = 'SUB-ZERO WINS';
            }
        }

        // Diminuir o Tempo
        function decreaseTimer() {
            timerInterval = setInterval(() => {
                if (timer > 0 && !gameOver) {
                    timer--;
                    document.getElementById('timer').innerText = timer;
                }
                if (timer === 0) {
                    determineWinner();
                }
            }, 1000);
        }

        // Loop de Animação do Jogo
        function animate() {
            window.requestAnimationFrame(animate);
            
            // Limpar a tela e desenhar o cenário de fundo de luta (Cenário Escuro)
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Chão da Arena
            ctx.fillStyle = '#441111';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

            // Atualizar Jogadores
            player1.update();
            player2.update();

            // Determinar lados dinamicamente (para onde estão olhando)
            if (player1.position.x < player2.position.x) {
                player1.side = 'left';
                player2.side = 'right';
            } else {
                player1.side = 'right';
                player2.side = 'left';
            }

            // Movimentação do Jogador 1
            player1.velocity.x = 0;
            if (keys.a.pressed) player1.velocity.x = -5;
            else if (keys.d.pressed) player1.velocity.x = 5;

            // Inteligência artificial simples para o Jogador 2 (persegue o P1 se estiver longe)
            player2.velocity.x = 0;
            if (!gameOver) {
                if (player2.position.x - player1.position.x > 80) {
                    player2.velocity.x = -2; // Anda para a esquerda
                } else if (player1.position.x - player2.position.x > 80) {
                    player2.velocity.x = 2; // Anda para a direita
                } else {
                    // Se estiver muito perto, tem chance de atacar sozinho
                    if (Math.random() < 0.02) player2.attack();
                }
            }

            // Checar Colisão de Ataque: Player 1 acertando Player 2
            if (rectangularCollision({ rectangle1: player1, rectangle2: player2 }) && player1.isAttacking) {
                player1.isAttacking = false;
                player2.health -= 10;
                document.getElementById('p2-health').style.width = player2.health + '%';
            }

            // Checar Colisão de Ataque: Player 2 acertando Player 1
            if (rectangularCollision({ rectangle1: player2, rectangle2: player1 }) && player2.isAttacking) {
                player2.isAttacking = false;
                player1.health -= 10;
                document.getElementById('p1-health').style.width = player1.health + '%';
            }

            // Condição de fim de vida (KO)
            if ((player1.health <= 0 || player2.health <= 0) && !gameOver) {
                determineWinner();
            }
        }

        // Reiniciar o Jogo
        function restartGame() {
            player1.health = 100;
            player2.health = 100;
            player1.position = { x: 150, y: 0 };
            player2.position = { x: 600, y: 0 };
            document.getElementById('p1-health').style.width = '100%';
            document.getElementById('p2-health').style.width = '100%';
            timer = 99;
            document.getElementById('timer').innerText = timer;
            document.getElementById('game-over-screen').style.display = 'none';
            gameOver = false;
            clearInterval(timerInterval);
            decreaseTimer();
        }

        // Eventos do Teclado (Inputs)
        window.addEventListener('keydown', (event) => {
            if (!gameOver) {
                switch (event.key) {
                    case 'd':
                    case 'D':
                        keys.d.pressed = true;
                        break;
                    case 'a':
                    case 'A':
                        keys.a.pressed = true;
                        break;
                    case 'w':
                    case 'W':
                        if (player1.velocity.y === 0) player1.velocity.y = -15; // Pulo
                        break;
                    case ' ': // Barra de espaço ataca
                        player1.attack();
                        break;
                }
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key) {
                case 'd':
                case 'D':
                    keys.d.pressed = false;
                    break;
                case 'a':
                case 'A':
                    keys.a.pressed = false;
                    break;
            }
        });

        // Mouse também faz o Player 2 atacar para testes rápidos
        window.addEventListener('click', () => {
            player2.attack();
        });

        // Iniciar Jogo
        decreaseTimer();
        animate();
    </script>
</body>
</html>
